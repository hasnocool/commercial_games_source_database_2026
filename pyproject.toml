[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-games-source-database-2026"
version = "0.5.0"
description = "Local-first database and dashboard for commercial games with later-released source code"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "hasnocool"}]
dependencies = ["aiohttp>=3.14.4,<3.15"]

[tool.setuptools]
py-modules = ["cgsdb"]

[tool.setuptools.packages.find]
include = ["cgsdb_discovery*"]

[project.scripts]
cgsdb = "cgsdb:main"
